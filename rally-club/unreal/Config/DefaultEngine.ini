[/Script/EngineSettings.GameMapsSettings]
; Create L_SunsetRooftop in the editor (see unreal/Content/README.md) and point these at it.
GameDefaultMap=/Game/Maps/L_SunsetRooftop.L_SunsetRooftop
EditorStartupMap=/Game/Maps/L_SunsetRooftop.L_SunsetRooftop
GlobalDefaultGameMode=/Script/RallyClub.RallyMatchGameMode

[/Script/Engine.RendererSettings]
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.DefaultFeature.MotionBlur=False
r.AntiAliasingMethod=4

[/Script/Engine.Engine]
+ActiveGameNameRedirects=(OldGameName="TP_Blank",NewGameName="/Script/RallyClub")

[/Script/Engine.PhysicsSettings]
; Ball flight is simulated deterministically by RallyCore at 120 Hz, not by Chaos rigid bodies.
bSubstepping=False

[Audio]
; Quartz + MetaSounds drive the DJ (ARallyDJBooth).
UseAudioMixer=True
